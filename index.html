<body>
<main class="wrap">
  <section class="card" id="card" aria-roledescription="carousel" aria-label="My storehouse collections">
    <div class="bshade" aria-hidden="true"></div>
    <div class="bclip" aria-hidden="true">
      <!-- gradient stays fixed (light top-left); only the square that masks it rotates -->
      <svg id="blob" viewBox="0 0 710 482" preserveAspectRatio="none">
        <defs>
          <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="310" y2="362"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient>
          <mask id="bmask" maskUnits="userSpaceOnUse" x="-50" y="-50" width="860" height="700"><g class="sway"><polygon id="bsq" fill="#fff" stroke="#fff" stroke-linejoin="round"/></g></mask>
        </defs>
        <rect x="-50" y="-50" width="860" height="700" fill="url(#bg)" mask="url(#bmask)"/>
      </svg>
    </div>
    <div class="glow" aria-hidden="true"></div>
    <svg class="logo" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5 2 12.5h10Z M7 6.5 4.6 12.2" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <svg class="smile" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="url(#gSm)"/><path d="M8 15c2 6 13 7 16 0z" fill="#3a2a1c" transform="rotate(-14 16 16)"/><circle cx="10" cy="11" r="1.7" fill="#3a2a1c"/><circle cx="21" cy="9" r="1.7" fill="#3a2a1c"/></svg>

    <div class="hclip" id="head" aria-live="polite"></div>
    <svg class="bean" viewBox="0 0 70 52" aria-hidden="true"><use href="#s-bean"/></svg>
    <div class="hero" id="hero" aria-hidden="true"></div>

    <div class="store">
      <h2>My<br>storehouse</h2>
      <div class="cols" aria-hidden="true"><span>PRODUCT</span><span>NO</span></div>
      <ul class="rows" id="rows"></ul>
    </div>

    <div class="dock">
      <svg class="ic ln" style="left:calc(var(--u)*32)" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="7" width="16" height="6" rx="1.5"/><path d="M6 7v2.5M10 7v2.5M14 7v2.5"/></svg>
      <svg class="ic ln" style="left:calc(var(--u)*68);color:#8b5cf6" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16.5l.8-3.6 9-9 2.8 2.8-9 9zM3 18h14"/></svg>
      <svg class="ic ln" style="left:calc(var(--u)*102)" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="5.5" r="2.6"/><path d="M5.5 17l1.5-6.5h6l1.5 6.5M8 13.5h4"/></svg>
      <svg class="ic ln" style="left:calc(var(--u)*121);width:calc(var(--u)*10)" viewBox="0 0 10 20" aria-hidden="true"><path d="M2.5 9 5 11.5 7.5 9"/></svg>
      <hr>
      <button id="next" aria-label="Next collection"><svg class="ln" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>
    </div>

    <div id="steps" role="group" aria-label="Choose collection"></div>
    <button id="play" aria-label="Pause autoplay" aria-pressed="false"><svg class="ln" viewBox="0 0 20 20" aria-hidden="true"><path id="pi" d="M7 5v10M13 5v10"/></svg></button>
  </section>
  <p class="credit">Inspired by <a href="https://dribbble.com/shots/16460483-Cake-Couch" rel="noopener">Cake Couch</a> by Cosmin Capitanu. Original SVG artwork, no copied assets.</p>
</main>
