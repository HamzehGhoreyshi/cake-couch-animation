<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cake Couch</title>
<meta name="description" content="A dependency-free animated product showcase in HTML, CSS and SVG. Inspired by Cake Couch by Cosmin Capitanu.">
<meta name="theme-color" content="#e2e2e3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237a3df2'/%3E%3Crect x='6' y='11' width='20' height='11' rx='5.5' fill='%23fff'/%3E%3C/svg%3E">
<style>
@property --c1 { syntax: "<color>"; inherits: true; initial-value: #b45ff8; }
@property --c2 { syntax: "<color>"; inherits: true; initial-value: #6b32f0; }
:root {
  --ink: #1b1b1f; --muted: #6f6e72; --page: #e2e2e3;
  --ease: cubic-bezier(.65, 0, .25, 1);
  --font: "Avenir Next", "Avenir", "Century Gothic", "Futura", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { color-scheme: light; }
body {
  margin: 0; min-height: 100svh; display: flex; flex-direction: column;
  background: radial-gradient(90% 70% at 50% 40%, #ececed, var(--page)); color: var(--ink);
  font: 500 15px/1.3 var(--font); -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid #5723ec; outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.wrap { width: 100%; flex: 1; container-type: inline-size; display: grid; justify-items: center; align-content: center; padding: 24px 16px; }

/* ---------- card: everything is placed in 710 x 482 design units ---------- */
.card {
  --u: calc(min(100cqw, 1080px) / 710);
  position: relative; width: calc(var(--u) * 710); height: calc(var(--u) * 482);
  border-radius: calc(var(--u) * 40); isolation: isolate;
  background: linear-gradient(180deg, #fff 55%, #f4f4f5);
  box-shadow: 0 calc(var(--u)*40) calc(var(--u)*70) calc(var(--u)*-34) rgba(30, 20, 50, .28), 0 1px 0 #fff inset;
  transition: --c1 1.2s var(--ease), --c2 1.2s var(--ease);
}
@media (min-height: 400px) { .card { --u: calc(min(100cqw, 1080px, (100svh - 190px) * 1.473) / 710); } }
.card * { position: absolute; }
.card br { position: static; }
svg { overflow: visible; }

/* BACKGROUND = one big rounded pentagon that turns about the same hidden centre as the objects.
   The card clips it, so you only ever see part of it: that is why the visible blob keeps changing
   outline while it rotates 144deg per theme. A pentagon looks identical every 72deg, so each
   theme rests on the same silhouette. Sway = tiny idle wobble so it is never still. */
.bclip { left: 0; top: 0; width: 100%; height: 100%; border-radius: inherit; overflow: hidden; pointer-events: none; }
.bclip svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
#bsq { transform-origin: 104px 128px; will-change: transform; transition: transform 1.25s cubic-bezier(.6, 0, .2, 1); }
.sway { transform-origin: 104px 128px; animation: sway 5.5s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotate(-2.4deg); } to { transform: rotate(2.4deg); } }
.glow { left: calc(var(--u)*200); top: calc(var(--u)*60); width: calc(var(--u)*330); height: calc(var(--u)*330); pointer-events: none;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--c2) 16%, transparent), transparent); }
.bshade { left: calc(var(--u)*10); top: calc(var(--u)*330); width: calc(var(--u)*330); height: calc(var(--u)*120);
  background: radial-gradient(closest-side, rgba(40, 30, 60, .09), transparent); }

.logo { left: calc(var(--u)*78); top: calc(var(--u)*48); width: calc(var(--u)*13); }
.smile { left: calc(var(--u)*634); top: calc(var(--u)*39); width: calc(var(--u)*32); }

/* headline strip: old text slides out left while the new one follows it in */
.hclip { left: 0; top: calc(var(--u)*86); width: calc(var(--u)*236); height: calc(var(--u)*130); overflow: hidden;
  -webkit-mask: linear-gradient(90deg, #000 88%, transparent); mask: linear-gradient(90deg, #000 88%, transparent); }
.ht { left: calc(var(--u)*62); top: 0; margin: 0; color: #fff; font-weight: 700; white-space: nowrap;
  font-size: calc(var(--u)*55); line-height: .96; letter-spacing: -.01em;
  transform: translateX(var(--d)); visibility: hidden; will-change: transform; }
.ht.cur, .ht.old { visibility: visible; transition: transform 1.15s var(--ease), opacity .35s ease; }
.ht.cur { transform: none; opacity: 1; }
/* old words slide out left, then fade so no letters are left stranded at the card edge */
.ht.old { transform: translateX(calc(var(--d) * -1)); opacity: 0; transition: transform 1.15s var(--ease), opacity .3s ease .8s; }

/* hero objects ride a hidden circle: the outer wrapper rotates around one shared pivot
   (--px/--py = pivot minus the object's own position), so every object travels on an arc
   of the same wheel. Clockwise always: enter from the top, leave past the bottom-left.
   The inner div counter-spins a little so objects tumble instead of turning upside down. */
.hero { left: 0; top: 0; width: calc(var(--u)*400); height: calc(var(--u)*362); z-index: 2; pointer-events: none; }
.bean { left: calc(var(--u)*44); top: calc(var(--u)*222); width: calc(var(--u)*56); }
.o { visibility: hidden; will-change: transform; --a: calc(var(--k, 1) * 150deg);
  transform-origin: calc(var(--u) * var(--px)) calc(var(--u) * var(--py)); }
.o > div, .o svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.o > div { will-change: transform; }
.o.cur, .o.old { visibility: visible; }
/* easing: enter = long expo-out settle, exit = soft ease-in-out that drifts away
   while it shrinks, blurs and fades (no sudden pop) */
.o.cur, .o.cur > div { animation: orbitIn 1.25s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--dl, 0s) + .2s); }
.o.cur > div { animation-name: spinIn; }
.o.old, .o.old > div { animation: orbitOut 1s cubic-bezier(.55, 0, .6, .6) both; animation-delay: calc(var(--dl, 0s) * .5); }
.o.old > div { animation-name: spinOut; }
.o svg { animation: float 6s ease-in-out infinite; animation-delay: var(--fd, 0s); will-change: transform; }
/* measured from the shot: new set swings in from about -150deg, old set leaves about +165deg */
@keyframes orbitIn { from { transform: rotate(calc(var(--a) * -1)); opacity: 0; } 25% { opacity: 1; } }
@keyframes orbitOut { 55% { opacity: 1; } to { transform: rotate(calc(var(--a) * 1.1)); opacity: 0; } }
/* inner div counter-rotates ~88% so objects stay nearly upright while they travel (the shot tilts them only slightly) */
@keyframes spinIn { from { transform: rotate(calc(var(--a) * .88)); } }
@keyframes spinOut { to { transform: rotate(calc(var(--a) * -.88)); } }
@keyframes float { 50% { transform: translateY(calc(var(--u) * -5)) rotate(var(--fr, 1deg)); } }

/* storehouse list */
.store { left: calc(var(--u)*380); top: calc(var(--u)*100); width: calc(var(--u)*330); height: calc(var(--u)*290); }
.store h2 { left: calc(var(--u)*28); top: 0; margin: 0; font-weight: 500; font-size: calc(var(--u)*27); line-height: 1.15; letter-spacing: .005em; }
.cols { left: calc(var(--u)*28); right: calc(var(--u)*50); top: calc(var(--u)*91); display: flex; justify-content: space-between;
  font-size: calc(var(--u)*7); font-weight: 600; letter-spacing: .1em; color: #3a3a40; }
.cols span { position: static; }
.rows { left: 0; top: calc(var(--u)*125); width: 100%; height: calc(var(--u)*165); margin: 0; padding: 0; list-style: none; }
.rows li { left: calc(var(--u)*-90); right: 0; height: calc(var(--u)*55); }
.rows li:nth-child(1) { top: 0; background: linear-gradient(90deg, rgba(240,240,242,0), #f0f0f2 32%); }
.rows li:nth-child(2) { top: calc(var(--u)*55); background: linear-gradient(90deg, rgba(244,244,246,0), #f5f5f7 32%); }
.rows li:nth-child(3) { top: calc(var(--u)*110); background: linear-gradient(90deg, rgba(250,250,251,0), #fafafb 32%); }
.win { left: calc(var(--u)*110); width: calc(var(--u)*242); top: calc(var(--u)*-8); height: calc(var(--u)*66); overflow: hidden; }
.seg { inset: 0; transform: translateX(100%); visibility: hidden; will-change: transform; }
.seg.cur, .seg.old { visibility: visible; transition: transform 1.05s var(--ease); transition-delay: var(--sd, 0s); }
.seg.cur { transform: none; }
.seg.old { transform: translateX(-100%); }
.rows li:nth-child(2) .seg { --sd: .06s; }
.rows li:nth-child(3) .seg { --sd: .12s; }
.seg b { left: calc(var(--u)*8); top: calc(var(--u)*25); font-weight: 500; font-size: calc(var(--u)*11.2); white-space: nowrap; color: #232327; }
.seg em { left: calc(var(--u)*131); top: calc(var(--u)*28); font-style: normal; font-weight: 500; font-size: calc(var(--u)*6.8); letter-spacing: .02em; color: #3a3a40; white-space: nowrap; }
.seg svg { left: calc(var(--u)*190); top: calc(var(--u)*6); width: calc(var(--u)*44); height: calc(var(--u)*52); }
.plus { right: calc(var(--u)*45); top: calc(var(--u)*17); font-size: calc(var(--u)*15); font-weight: 400; line-height: 1; color: #222; }

/* bottom controls */
.dock { left: calc(var(--u)*308); top: calc(var(--u)*372); width: calc(var(--u)*222); height: calc(var(--u)*54); border-radius: 99px;
  background: rgba(255,255,255,.96); box-shadow: 0 calc(var(--u)*14) calc(var(--u)*30) calc(var(--u)*-8) rgba(30,20,50,.18), 0 0 0 1px rgba(0,0,0,.025); }
.dock .ic { top: calc(var(--u)*18); width: calc(var(--u)*18); height: calc(var(--u)*18); }
.dock hr { left: calc(var(--u)*152); top: calc(var(--u)*15); width: 1px; height: calc(var(--u)*24); margin: 0; border: 0; background: #e6e6e9; }
#next { left: calc(var(--u)*170); top: calc(var(--u)*5); width: calc(var(--u)*44); height: calc(var(--u)*44); border-radius: 50%;
  background: #2b2b30; color: #fff; display: grid; place-items: center; box-shadow: 0 6px 14px -6px rgba(0,0,0,.5); transition: transform .2s; }
#next:hover { transform: scale(1.06); }
#next:active { transform: scale(.94); }
#next svg { position: static; width: calc(var(--u)*14); height: calc(var(--u)*14); }
#steps { left: calc(var(--u)*35); top: calc(var(--u)*405); height: calc(var(--u)*42); width: calc(var(--u)*170); }
#steps button { top: 0; width: calc(var(--u)*42); height: calc(var(--u)*42); border-radius: calc(var(--u)*12);
  display: grid; place-items: center; color: #5d5d63; transition: background-color .35s; }
#steps button:nth-of-type(2) { left: calc(var(--u)*68); }
#steps button:nth-of-type(3) { left: calc(var(--u)*127); }
#steps button[aria-pressed="true"] { background: #e9e9eb; color: #2b2b30; }
#steps i { top: calc(var(--u)*20.5); width: calc(var(--u)*11); height: 1px; background: #b9b9bf; }
#steps i:nth-of-type(1) { left: calc(var(--u)*50); }
#steps i:nth-of-type(2) { left: calc(var(--u)*110); }
#play { left: calc(var(--u)*632); top: calc(var(--u)*405); width: calc(var(--u)*42); height: calc(var(--u)*42); border-radius: calc(var(--u)*12);
  background: #ececee; display: grid; place-items: center; color: #3b3b40; }
#steps svg, #play svg { position: static; width: calc(var(--u)*17); height: calc(var(--u)*17); }
.ln { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

.credit { margin: 20px 0 0; font-size: 12px; color: var(--muted); text-align: center; }
.credit a { color: inherit; }

/* signature footer: full-width white bar at the bottom of the page (same pattern as my other projects) */
.sig { width: 100%; height: 56px; padding: 0 60px; background: #fff; border-top: 1px solid rgba(28, 26, 23, .08);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; white-space: nowrap; font-size: 12px; line-height: 1; color: #8a857c; }
.sig a { display: inline-flex; align-items: center; gap: 6px; height: 20px; color: inherit; text-decoration: none; border-radius: 6px; transition: opacity .2s; }
.sig a:hover { opacity: .7; }
.sig strong { color: #3a3a40; font-weight: 600; }
.sig svg { display: block; flex: none; width: 13px; height: 13px; fill: #3a3a40; }
.sig .star-icon { fill: #f5a03a; }
.sig .start { justify-self: start; }
.sig .mid { justify-self: center; display: inline-flex; align-items: center; height: 20px; }
.sig .end { justify-self: end; display: inline-flex; align-items: center; gap: 10px; height: 20px; }
.sig .dot { opacity: .5; }

/* ---------- phone: blob on top, list below (343 design units wide) ---------- */
@media (max-width: 640px) {
  .wrap { padding: 16px; align-content: start; }
  .sig { height: auto; grid-template-columns: 1fr; justify-items: center; gap: 8px; padding: 14px 16px max(14px, env(safe-area-inset-bottom)); }
  .sig .start, .sig .mid, .sig .end { justify-self: center; }
  .card { --u: calc(100cqw / 343); width: 100%; height: calc(var(--u)*742); border-radius: calc(var(--u)*30); background: #fff; }
  .bclip { height: calc(var(--u)*300); border-radius: calc(var(--u)*30) calc(var(--u)*30) 0 0; }
  .glow { left: calc(var(--u)*40); top: calc(var(--u)*170); width: calc(var(--u)*280); height: calc(var(--u)*240); }
  .bshade { top: calc(var(--u)*270); }
  .logo { left: calc(var(--u)*26); top: calc(var(--u)*30); }
  .smile { left: calc(var(--u)*289); top: calc(var(--u)*22); }
  .hclip { top: calc(var(--u)*70); width: calc(var(--u)*170); -webkit-mask: none; mask: none; }
  .ht { left: calc(var(--u)*24); font-size: calc(var(--u)*42); }
  .hero { left: calc(var(--u)*-40); top: calc(var(--u)*24); transform: scale(.72); transform-origin: 100% 0; }
  .bean { left: calc(var(--u)*30); top: calc(var(--u)*200); }
  .store { left: 0; top: calc(var(--u)*322); width: calc(var(--u)*343); }
  .store h2 { left: calc(var(--u)*20); }
  .cols { left: calc(var(--u)*20); right: calc(var(--u)*30); top: calc(var(--u)*82); }
  .rows { top: calc(var(--u)*112); }
  .rows li { left: 0; }
  .win { left: calc(var(--u)*12); width: calc(var(--u)*268); }
  .seg em { left: calc(var(--u)*140); }
  .seg svg { left: calc(var(--u)*212); }
  .plus { right: calc(var(--u)*26); }
  .dock { left: calc(var(--u)*60); top: calc(var(--u)*596); }
  #steps { left: calc(var(--u)*18); top: calc(var(--u)*680); }
  #play { left: calc(var(--u)*283); top: calc(var(--u)*680); }
}
@media (prefers-reduced-motion: reduce) {
  .o.cur, .o.old, .o > div, .o svg, .sway { animation: none !important; }
  #bsq { transition: none; }
  .o.old { visibility: hidden; }
  .ht, .seg { transition: none !important; }
}
</style>
</head>
<body>
<main class="wrap">
  <section class="card" id="card" aria-roledescription="carousel" aria-label="My storehouse collections">
    <div class="bshade" aria-hidden="true"></div>
    <div class="bclip" aria-hidden="true">
      <!-- gradient stays fixed (light top-left); only the square that masks it rotates -->
      <svg id="blob" viewBox="0 0 710 482" preserveAspectRatio="none">
        <defs>
          <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="310" y2="362"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient>
          <mask id="bmask" maskUnits="userSpaceOnUse" x="-50" y="-50" width="860" height="700"><g class="sway"><polygon id="bsq" fill="#fff" stroke="#fff" stroke-linejoin="round"/></g></mask>
        </defs>
        <rect x="-50" y="-50" width="860" height="700" fill="url(#bg)" mask="url(#bmask)"/>
      </svg>
    </div>
    <div class="glow" aria-hidden="true"></div>
    <svg class="logo" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5 2 12.5h10Z M7 6.5 4.6 12.2" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <svg class="smile" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="url(#gSm)"/><path d="M8 15c2 6 13 7 16 0z" fill="#3a2a1c" transform="rotate(-14 16 16)"/><circle cx="10" cy="11" r="1.7" fill="#3a2a1c"/><circle cx="21" cy="9" r="1.7" fill="#3a2a1c"/></svg>

    <div class="hclip" id="head" aria-live="polite"></div>
    <svg class="bean" viewBox="0 0 70 52" aria-hidden="true"><use href="#s-bean"/></svg>
    <div class="hero" id="hero" aria-hidden="true"></div>

    <div class="store">
      <h2>My<br>storehouse</h2>
      <div class="cols" aria-hidden="true"><span>PRODUCT</span><span>NO</span></div>
      <ul class="rows" id="rows"></ul>
    </div>

    <div class="dock">
      <svg class="ic ln" style="left:calc(var(--u)*32)" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="7" width="16" height="6" rx="1.5"/><path d="M6 7v2.5M10 7v2.5M14 7v2.5"/></svg>
      <svg class="ic ln" style="left:calc(var(--u)*68);color:#8b5cf6" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16.5l.8-3.6 9-9 2.8 2.8-9 9zM3 18h14"/></svg>
      <svg class="ic ln" style="left:calc(var(--u)*102)" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="5.5" r="2.6"/><path d="M5.5 17l1.5-6.5h6l1.5 6.5M8 13.5h4"/></svg>
      <svg class="ic ln" style="left:calc(var(--u)*121);width:calc(var(--u)*10)" viewBox="0 0 10 20" aria-hidden="true"><path d="M2.5 9 5 11.5 7.5 9"/></svg>
      <hr>
      <button id="next" aria-label="Next collection"><svg class="ln" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>
    </div>

    <div id="steps" role="group" aria-label="Choose collection"></div>
    <button id="play" aria-label="Pause autoplay" aria-pressed="false"><svg class="ln" viewBox="0 0 20 20" aria-hidden="true"><path id="pi" d="M7 5v10M13 5v10"/></svg></button>
  </section>
  <p class="credit">Inspired by <a href="https://dribbble.com/shots/16460483-Cake-Couch" rel="noopener">Cake Couch</a> by Cosmin Capitanu. Original SVG artwork, no copied assets.</p>
</main>
  <footer class="sig">
    <a class="start" href="https://hamzeh.framer.ai" target="_blank" rel="noopener">&copy; 2026 <strong>Hamzeh</strong></a>
    <span class="mid">Powered by&nbsp;<strong>Claude</strong></span>
    <span class="end">
      <a href="https://github.com/HamzehGhoreyshi/cake-couch-animation" target="_blank" rel="noopener" aria-label="Source code on GitHub, by HamzehGhoreyshi"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><strong>HamzehGhoreyshi</strong></a>
      <span class="dot" aria-hidden="true">&middot;</span>
      <a href="https://github.com/HamzehGhoreyshi/cake-couch-animation" target="_blank" rel="noopener" aria-label="Star this project on GitHub"><svg class="star-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.751.751 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg><strong>Star</strong></a>
    </span>
  </footer>

<!-- shared artwork: gradients, blur filters and symbols, drawn by hand -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
  <filter id="b3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="b5" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="b2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
  <radialGradient id="gSm" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffd27a"/><stop offset=".7" stop-color="#f6a93c"/><stop offset="1" stop-color="#e48f2a"/></radialGradient>

<script>
/* ---------- data: the only place content lives ---------- */
/* hero items: [symbol, x, y, w, h, rotate, blur(0|3|5), depth k, delay s] in 710x482 card units */
const THEMES = [
  { name: ["Sofa", "cake"], c1: "#b862f8", c2: "#6a30f0", icon: "i-sofa",    rows: [["Worktop", "s-stool"], ["Couch capsule", "s-pillow"], ["Couch cake", "t-ring"]],
    hero: [["s-stool", 128, 192, 108, 120, -4, 3, 1.25, .1], ["s-sofa", 176, 128, 212, 125, 0, 0, 1, 0], ["s-pillow", 210, -38, 88, 88, 18, 5, 1.4, .16]] },
  { name: ["Blob", "sofa"], c1: "#ffd65e", c2: "#f5a03a", icon: "i-pod",    rows: [["Purifier O2", "t-puri"], ["Copse combo", "t-chair"], ["Bouncy prop", "t-coral"]],
    hero: [["s-knot", 176, 106, 216, 181, -9, 0, 1, 0], ["s-gold", 116, 216, 90, 90, 0, 3, 1.3, .1], ["s-pinkb", 196, 4, 72, 72, 0, 5, 1.45, .18]] },
  { name: ["Herbs", "pods"], c1: "#4cefd6", c2: "#18d4b6", icon: "i-box",    rows: [["Herbs pods", "s-plant"], ["Garden pack", "t-pack"], ["Outdoor light", "t-lamp"]],
    hero: [["s-plant", 184, 66, 90, 264, 0, 0, 1, 0], ["s-cloud", 50, 252, 146, 84, 0, 5, 1.3, .12]] }
];

/* centre of the hidden circle the hero objects orbit, in card units */
const ORBIT = [104, 128];

const $ = id => document.getElementById(id);
const card = $("card"), head = $("head"), hero = $("hero"), rows = $("rows"), steps = $("steps");
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
const u = n => `calc(var(--u)*${n})`;
const sym = (id, blur, rot) => {
  if (id === "s-gold" || id === "s-pinkb") return `<svg viewBox="0 0 100 100"><g filter="url(#b${blur})"><circle cx="50" cy="50" r="46" fill="url(#g${id === "s-gold" ? "Gold" : "Pink"})"/></g></svg>`;
  const use = `<use href="#${id}" width="100%" height="100%"${rot ? ` style="transform:rotate(${rot}deg);transform-origin:50% 50%;transform-box:view-box"` : ""}/>`;
  return `<svg>${blur ? `<g filter="url(#b${blur})">${use}</g>` : use}</svg>`;
};

/* ---------- build every theme once ---------- */
const layers = THEMES.map((t, ti) => {
  const h = document.createElement("p");
  h.className = "ht"; h.innerHTML = t.name.join("<br>");
  head.append(h);
  const objs = t.hero.map(([id, x, y, w, ht, r, b, k, d], n) => {
    const o = document.createElement("div");
    o.className = "o";
    o.style.cssText = `left:${u(x)};top:${u(y)};width:${u(w)};height:${u(ht)};--px:${ORBIT[0] - x};--py:${ORBIT[1] - y};--k:${k};--dl:${d}s;--fd:${-(ti * 2 + n * 1.3)}s;--fr:${n % 2 ? -1.5 : 1}deg`;
    o.innerHTML = `<div>${sym(id, b, r)}</div>`;
    hero.append(o);
    return o;
  });
  return { h, objs };
});
THEMES[0].rows.forEach((_, r) => {
  const li = document.createElement("li");
  li.innerHTML = `<div class="win">${THEMES.map(t => `<div class="seg"><b>${t.rows[r][0]}</b><em>110 x 110</em><svg viewBox="0 0 44 52" aria-hidden="true"><use href="#${t.rows[r][1]}"/></svg></div>`).join("")}</div><span class="plus" aria-hidden="true">+</span>`;
  rows.append(li);
});
const segs = [...rows.children].map(li => [...li.querySelectorAll(".seg")]);
THEMES.forEach((t, i) => {
  if (i) steps.append(document.createElement("i"));
  const b = document.createElement("button");
  b.setAttribute("aria-label", `Show ${t.name.join(" ")}`);
  b.innerHTML = `<svg viewBox="0 0 20 20" aria-hidden="true"><use href="#${t.icon}"/></svg>`;
  b.onclick = () => { go(i); schedule(); };
  steps.append(b);
});
const stepBtns = [...steps.querySelectorAll("button")];

/* ---------- state ---------- */
let cur = -1, timer = 0, paused = false, held = false, cleanup = 0;
function go(i) {
  if (i === cur) return;
  const prev = cur; cur = i;
  const t = THEMES[i], L = layers[i];
  clearTimeout(cleanup);
  layers.forEach((l, k) => { if (k !== prev && k !== i) { l.h.className = "ht"; l.objs.forEach(o => o.className = "o"); segs.forEach(s => s[k].className = "seg"); } });
  if (prev >= 0) {
    const P = layers[prev];
    head.style.setProperty("--d", P.h.offsetWidth + card.offsetWidth * .05 + "px");
    void head.offsetWidth;
    P.h.className = "ht old";
    P.objs.forEach(o => o.className = "o old");
    segs.forEach(s => s[prev].className = "seg old");
    cleanup = setTimeout(() => { P.h.className = "ht"; P.objs.forEach(o => o.className = "o"); segs.forEach(s => s[prev].className = "seg"); }, 2000);
  }
  L.h.className = "ht cur";
  L.objs.forEach(o => o.className = "o cur");
  segs.forEach(s => s[i].className = "seg cur");
  if (prev >= 0) { turns++; spin(); }
  card.style.setProperty("--c1", t.c1);
  card.style.setProperty("--c2", t.c2);
  stepBtns.forEach((b, k) => b.setAttribute("aria-pressed", k === i));
}

/* ---------- autoplay: pauses on hover/focus, hidden tab, button, reduced motion ---------- */
function schedule() {
  clearTimeout(timer);
  if (!paused && !held && !reduce.matches && !document.hidden) timer = setTimeout(() => { go((cur + 1) % THEMES.length); schedule(); }, 2600);
}
$("next").onclick = () => { go((cur + 1) % THEMES.length); schedule(); };
$("play").onclick = e => {
  paused = !paused;
  const b = e.currentTarget;
  b.setAttribute("aria-pressed", paused);
  b.setAttribute("aria-label", paused ? "Resume autoplay" : "Pause autoplay");
  $("pi").setAttribute("d", paused ? "M7 5l8 5-8 5z" : "M7 5v10M13 5v10");
  schedule();
};
card.addEventListener("pointerenter", () => { held = true; schedule(); });
card.addEventListener("pointerleave", () => { held = false; schedule(); });
card.addEventListener("focusin", () => { held = true; schedule(); });

/* ---------- background pentagon: rotates 144deg (= 2 sides) per theme, always clockwise ----------
   a regular pentagon looks identical every 72deg, so every theme rests on the same silhouette.
   Rounded corners = a thick stroke with round joins around a smaller pentagon. */
const bsq = $("bsq"), bsvg = $("blob"), mobile = matchMedia("(max-width: 640px)");
const TILT = 10, STEP = 144;
let turns = 0;
const spin = () => { bsq.style.transform = `rotate(${TILT + turns * STEP}deg)`; };
function layoutBlob() {                      // desktop: 710x482 card, phone: 343x300 blob panel
  const m = mobile.matches, o = m ? [150, 100] : [104, 128], a = m ? 170 : 190, r = 70 * (m ? .86 : 1);
  const R = (a - r) / Math.cos(Math.PI / 5);          // inner pentagon radius (flat side faces right)
  const pts = [-36, 36, 108, 180, 252].map(d => [o[0] + R * Math.cos(d * Math.PI / 180), o[1] + R * Math.sin(d * Math.PI / 180)]);
  bsvg.setAttribute("viewBox", m ? "0 0 343 300" : "0 0 710 482");
  bsq.setAttribute("points", pts.map(q => q.map(n => n.toFixed(1)).join(",")).join(" "));
  bsq.setAttribute("stroke-width", r * 2);
  for (const el of [bsq, bsq.parentNode]) el.style.transformOrigin = `${o[0]}px ${o[1]}px`;
  bsq.style.transition = "none"; spin(); void bsq.getBoundingClientRect(); bsq.style.transition = "";
}
mobile.addEventListener("change", layoutBlob);
layoutBlob();
go(0);
schedule();
